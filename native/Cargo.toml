[package]
name = "typenet-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candle-core = "0.9"
napi = { version = "3" }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", features = ["metal", "accelerate"] }

[build-dependencies]
napi-build = "1"

[profile.release]
lto = true
codegen-units = 1
